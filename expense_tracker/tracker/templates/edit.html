<!DOCTYPE html>
<html>
<head>

    <title>Edit Expense</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f4f4;
        }

        .box{
            width:400px;
            margin:100px auto;
            background:white;
            padding:20px;
            border-radius:10px;
        }

        input, select{
            width:100%;
            padding:10px;
            margin:10px 0;
        }

        button{
            width:100%;
            padding:10px;
            background:green;
            color:white;
            border:none;
        }
        
        button:hover{
            background:darkgreen;
        }

    </style>

</head>

<body>

<div class="box">

    <h2>Edit Expense</h2>

    <form method="POST">

        {% csrf_token %}

        <input type="text"
               name="title"
               value="{{ expense.title }}"
               required>

        <input type="number"
               name="amount"
               value="{{ expense.amount }}"
               required>

        <select name="category">

            <option>{{ expense.category }}</option>

            <option>Food</option>
            <option>Travel</option>
            <option>Shopping</option>
            <option>Bills</option>
            <option>Other</option>

        </select>

        <button type="submit">Update Expense</button>
        <a href="/">
            <button type="button" style="background:red;">Cancel</button>
        </a>

    </form>

</div>

</body>
</html>
