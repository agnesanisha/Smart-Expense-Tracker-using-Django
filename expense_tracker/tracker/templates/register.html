<!DOCTYPE html>
<html>
<head>

    <title>Register</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f4f4;
        }

        .box{
            width:340px;
            margin:100px auto;
            background:white;
            padding:25px;
            border-radius:12px;
            box-shadow:0px 0px 15px rgba(0,0,0,0.1);
            text-align:center;
        }

        input{
            width:90%;
            padding:10px;
            margin:10px 0;
        }

        button{
            width:100%;
            padding:10px;
            background:green;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:darkgreen;
        }

    </style>

</head>

<body>

<div class="box">

    <h2>Register</h2>
    {% if error %}
    <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <input type="text"
               name="username"
               placeholder="Username"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <input type="password"
               name="confirm_password"
               placeholder="Confirm Password"
               required>

        <button type="submit">Register</button>

    </form>

    <p>
        Already have account?
        <a href="/login/" style='color:blue'>Login here</a>
    </p>

</div>

</body>
</html>
