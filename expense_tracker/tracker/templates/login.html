<!DOCTYPE html>
<html>
<head>

    <title>Login</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f4f4;
        }

        .box{
            width:300px;
            margin:100px auto;
            background:white;
            padding:20px;
            border-radius:10px;
        }
        
        .box h2{
            text-align:center
        }

        input{
            width:91%;
            padding:10px;
            margin:10px 0;
        }

        button{
            width:100%;
            padding:10px;
            background:green;
            color:white;
            border:none;
        }

    </style>

</head>

<body>

<div class="box">

    <h2>Login</h2>

    {% if error %}
    <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <input type="text"
               name="username"
               placeholder="Username"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">Login</button>

    </form>

    <p>
        Don't have account?
        <a href="/register/">Register</a>
    </p>

</div>

</body>
</html>
